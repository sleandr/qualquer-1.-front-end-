<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .texto{
            color: aqua;
        }
        .campo{
            border:1px solid greenyellow;

        }
        .botao{
            background-color:red;
            color: aliceblue;
        }
        .fieldset{
            border:1px solid black;


        }
    </style>
</head>

<body>
    <form id="formulario">
        <fieldset>
            <legend>cadastro do firebase</legend>
        <p class="texto">CPF: <input type="text" id="cpf" class="campo" placeholder= "digite seu cpf" maxlength="11" minlegth="11" required><br><br></p>
        <p class="texto">email: <input type="text" id="email" class="campo" placeholder="digite seu email" maxlength="30" minlegth="11" required><br><br></p>
        <p class="texto">nome: <input type="text" id="nome" class="campo" placeholder="digite seu nome" maxlength="50" minlegth="3" required><br><br></p>
        <p class="texto">senha: <input type="text" id="senha" class="campo" placeholder="digite seu senha" maxlength="10" minlegth="5" required><br><br></p>
        <p class="texto">telefone: <input type="text" id="telefone" class="campo" placeholder="digite seu telefone" maxlength="11" minlegth="11" required><br><br></p>
        <input type="submit" value="cadastrar">
        </fieldset>
        
    </form>

</body>

</html>
